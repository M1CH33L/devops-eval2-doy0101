version: '3.8'

services:
  ms-python:
    build:
      context: ./ms-python
      dockerfile: Dockerfile
    container_name: devops-ms-python
    ports:
      - "5000:5000"
    networks:
      - devops-network
    restart: unless-stopped
    environment:
      - PORT=5000
      - ENV=production

  ms-java:
    build:
      context: ./ms-java
      dockerfile: Dockerfile
    container_name: devops-ms-java
    ports:
      - "8080:8080"
    networks:
      - devops-network
    restart: unless-stopped
    depends_on:
      - ms-python

networks:
  devops-network:
    driver: bridge